name: Tests

on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}${{ matrix.dependencies == 'lowest' && ' (lowest dependencies)' || '' }}
    runs-on: ubuntu-latest

    strategy:
      # Every version reports for itself; a failure on one must not hide the rest
      fail-fast: false
      matrix:
        # The range composer.json declares
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['highest']
        include:
          # The oldest versions composer.json allows, above all Kirby 5.2 –
          # the minimum the README promises
          - php: '8.2'
            dependencies: 'lowest'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          # The extensions Kirby requires, from its own composer.json
          extensions: ctype, curl, dom, filter, hash, iconv, json, libxml, mbstring, openssl, simplexml
          coverage: none

      # Before the install, so only the plugin's own files are checked
      - name: Syntax check
        run: find . -name '*.php' -print0 | xargs -0 -n1 -P4 php -l

      # getkirby/cms is a dev dependency and of type kirby-cms, so the
      # composer installer puts it into ./kirby rather than the vendor directory
      - name: Install dependencies
        if: matrix.dependencies == 'highest'
        run: composer install --no-interaction --no-progress --prefer-dist

      # Composer refuses versions with security advisories by default (since
      # 2.9), and old Kirby releases have some. Without switching that off, the
      # resolver would quietly pick a newer Kirby and the job would test the
      # wrong thing. Written straight into composer.json under the old and the
      # new name of the setting: `composer config` rejects keys a given
      # Composer version does not know, composer.json simply ignores them.
      - name: Install lowest dependencies
        if: matrix.dependencies == 'lowest'
        run: |
          php -r '$composer = json_decode(file_get_contents("composer.json"), true);
            $composer["config"]["audit"]["block-insecure"] = false;
            $composer["config"]["policy"]["advisories"]["block"] = false;
            file_put_contents("composer.json", json_encode($composer, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES));'
          composer update --prefer-lowest --prefer-stable --no-interaction --no-progress --prefer-dist

      - name: Check that the lowest Kirby is installed
        if: matrix.dependencies == 'lowest'
        run: |
          installed=$(composer show getkirby/cms --format=json | php -r 'echo json_decode(stream_get_contents(STDIN))->versions[0];')
          echo "getkirby/cms $installed"
          test "$installed" = "5.2.0"

      - name: Tests
        run: composer test

  dist:
    name: Dist archive
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # `composer require` installs the archive git produces from the
      # export-ignore rules in .gitattributes, not the repository. A wrong rule
      # there stays invisible in every other check: the tests keep passing while
      # the installed plugin is missing a file – or ships the test suite.
      - name: Check what composer require would install
        run: |
          archive=$(git archive HEAD | tar -t)
          status=0

          for entry in composer.json index.php index.css index.js LICENSE SECURITY.md \
                       README.md README.de.md plugin/ src/ translations/; do
              if ! grep -qxF "$entry" <<< "$archive"; then
                  echo "missing from the dist archive: $entry"
                  status=1
              fi
          done

          for entry in tests/ .github/ ARCHITECTURE.md phpunit.xml .gitattributes .gitignore; do
              if grep -qF "$entry" <<< "$archive"; then
                  echo "should not ship: $entry"
                  status=1
              fi
          done

          if [ "$status" -eq 0 ]; then
              echo "Dist archive as expected ($(wc -l <<< "$archive") entries)"
          fi

          exit "$status"

  # Kirby reads the installed version from index.php when the plugin is copied
  # or downloaded as a ZIP. A tag that disagrees with it would make the Panel
  # offer an update that is already installed, or hide one that is not.
  version:
    name: Tag matches version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compare the tag with the version in index.php
        run: |
          version=$(grep -oP "version: '\K[^']+" index.php || true)

          if [ "$version" != "$GITHUB_REF_NAME" ]; then
              echo "tag $GITHUB_REF_NAME, but index.php declares ${version:-no version}"
              exit 1
          fi

          echo "index.php declares $version"
